<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farándula PC</title>
    <!-- Versión de escritorio (2026-11-21): varias pestañas "Crear", cada una con su propio proceso,
         para hacer varios videos a la vez en una sola ventana. Cada pestaña es la aplicación de
         siempre, entera, dentro de un marco; esta página solo las organiza. -->
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --surface-alt: #f1f5f9; --border: #e2e8f0;
            --text: #1e293b; --text-muted: #52616f; --text-dim: #94a3b8;
            --accent: #2563eb; --accent-tint: #eff6ff; --success: #16a34a; --warning: #b45309;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; flex-direction: column; background: var(--bg); color: var(--text);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px;
        }
        .barra {
            display: flex; align-items: flex-end; gap: 4px; padding: 8px 10px 0;
            background: var(--surface); border-bottom: 1px solid var(--border); flex: 0 0 auto;
            overflow-x: auto; scrollbar-width: thin;
        }
        .marca { font-weight: 700; padding: 0 12px 9px 4px; white-space: nowrap; color: var(--text-muted); }
        .pestana {
            display: inline-flex; align-items: center; gap: 8px; max-width: 240px; min-width: 120px;
            padding: 8px 8px 8px 12px; border: 1px solid transparent; border-bottom: 0;
            border-radius: 8px 8px 0 0; background: var(--surface-alt); color: var(--text-muted);
            cursor: pointer; user-select: none; margin-bottom: -1px; font: inherit;
        }
        .pestana:hover { color: var(--text); }
        .pestana.activa { background: var(--bg); border-color: var(--border); color: var(--accent); font-weight: 600; }
        .pestana .nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .pestana .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex: 0 0 auto; }
        .pestana .punto[data-estado="trabajando"] { background: var(--warning); }
        .pestana .punto[data-estado="listo"] { background: var(--success); }
        .pestana .cerrar {
            border: 0; background: transparent; color: var(--text-dim); cursor: pointer; font-size: 15px;
            line-height: 1; padding: 2px 5px; border-radius: 4px;
        }
        .pestana .cerrar:hover { background: #fee2e2; color: #dc2626; }
        .nueva {
            border: 1px dashed var(--border); background: transparent; color: var(--accent); font: inherit;
            font-weight: 600; padding: 7px 12px; border-radius: 8px; cursor: pointer; margin: 0 4px 6px;
            white-space: nowrap;
        }
        .nueva:hover { background: var(--accent-tint); }
        .espacio { flex: 1; }
        .pestana.publicar { min-width: 0; }
        .marcos { flex: 1 1 auto; position: relative; }
        .marcos iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
        .marcos iframe.activo { display: block; }
    </style>
</head>
<body>
    <div class="barra" id="barra">
        <span class="marca">🎬 Farándula PC</span>
        <div id="pestanas" style="display:flex; gap:4px; align-items:flex-end"></div>
        <button class="nueva" type="button" onclick="nuevaPestana()" title="Abrir otro video en paralelo (Ctrl+T)">＋ Nuevo video</button>
        <span class="espacio"></span>
        <button class="pestana publicar" type="button" id="pestana-publicar" onclick="activar('publicar')">🚀 Publicar <span id="publicar-n"></span></button>
    </div>
    <div class="marcos" id="marcos"></div>
    <script src="escritorio.js"></script>
</body>
</html>
